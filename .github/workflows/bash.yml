name: Bash CI Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_script:
        description: 'Run the bash script'
        required: true
        default: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Bash Script
        run: bash ./run.sh
